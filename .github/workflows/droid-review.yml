# factory-automation: 82426ddf-00d7-480a-ba0b-666f3e30279d
name: Droid Code Review
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  push:
    branches:
      - "**"
  issue_comment:
    types:
      - created
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Factory droid-action
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_depth: deep
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request != null && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
